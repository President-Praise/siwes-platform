<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIWES Report Platform</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f7; color: #1a1a1a; max-width: 720px; margin: 0 auto; padding: 3rem 1.5rem; }
    h1 { color: #1E3A5F; font-family: Georgia, serif; }
    .school { display: block; padding: 1rem 1.25rem; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 0.75rem; text-decoration: none; color: #1a1a1a; border-left: 4px solid #C9A84C; }
    .school strong { color: #1E3A5F; }
    .muted { color: #6b6b75; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>SIWES Report Platform</h1>
  <p class="muted">Choose your university to begin.</p>
  {% for s in schools %}
    <a class="school" href="/{{ s.slug }}"><strong>{{ s.name }}</strong><div class="muted">{{ s.full_name }}</div></a>
  {% else %}
    <p class="muted">No schools onboarded yet.</p>
  {% endfor %}
  <p class="muted" style="margin-top: 2rem;"><a href="/admin/">Admin login</a></p>
</body>
</html>
