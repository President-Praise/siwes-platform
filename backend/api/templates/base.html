<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ school.name }} — SIWES Report{% endblock %}</title>
  <style>
    :root {
      --navy: #1E3A5F;
      --navy-dark: #15293f;
      --gold: #C9A84C;
      --gold-dark: #b08e3a;
      --bg: #f5f5f7;
      --card: #ffffff;
      --border: #e3e3e8;
      --text: #1a1a1a;
      --muted: #6b6b75;
      --danger: #b00020;
      --success: #2e7d32;
      --shadow: 0 2px 8px rgba(30, 58, 95, 0.08);
      --shadow-lg: 0 6px 24px rgba(30, 58, 95, 0.12);
      --radius: 8px;
      --font-head: Georgia, "Times New Roman", "Liberation Serif", serif;
      --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { font-family: var(--font-body); background: var(--bg); color: var(--text); line-height: 1.5; -webkit-font-smoothing: antialiased; }

    header.app-header {
      background: var(--navy); color: #fff; padding: 1rem 1.5rem;
      border-bottom: 4px solid var(--gold);
      display: flex; align-items: center; gap: 1rem;
    }
    header.app-header img.logo { height: 44px; width: auto; background: #fff; padding: 4px; border-radius: 4px; }
    header.app-header .title { font-family: var(--font-head); font-size: 1.35rem; font-weight: 600; }
    header.app-header .subtitle { font-size: 0.82rem; opacity: 0.85; margin-top: 2px; }

    main { max-width: 760px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    h1, h2, h3 { font-family: var(--font-head); color: var(--navy); margin: 0 0 0.5rem; }
    h2 { font-size: 1.5rem; }
    h3 { font-size: 1.1rem; }
    p { margin: 0 0 0.75rem; }
    .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1.75rem; margin-bottom: 1.25rem; }
    label { display: block; font-weight: 600; margin: 1rem 0 0.35rem; color: var(--navy); font-size: 0.9rem; }
    label small { font-weight: 400; color: var(--muted); font-size: 0.78rem; }
    input[type=text], input[type=email], input[type=date], input[type=number], input[type=tel], select, textarea {
      width: 100%; padding: 0.65rem 0.75rem; border: 1.5px solid var(--border); border-radius: 5px;
      font-family: inherit; font-size: 0.95rem; background: #fff; color: var(--text);
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,168,76,0.18); }
    textarea { min-height: 90px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85rem; }
    input[type=file] { width: 100%; padding: 0.55rem; border: 1.5px dashed var(--border); border-radius: 5px; background: #fafafa; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
    @media (max-width: 640px) { .row, .row-3 { grid-template-columns: 1fr; } }
    button {
      font-family: inherit; font-size: 0.95rem; font-weight: 600;
      padding: 0.7rem 1.5rem; border-radius: 5px; cursor: pointer; border: none;
    }
    button.primary { background: var(--navy); color: #fff; }
    button.primary:hover { background: var(--navy-dark); }
    button.gold { background: var(--gold); color: var(--navy); }
    button.gold:hover { background: var(--gold-dark); color: #fff; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .package-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.85rem; }
    @media (max-width: 640px) { .package-grid { grid-template-columns: 1fr; } }
    .pkg-card { border: 2px solid var(--border); border-radius: var(--radius); padding: 1.1rem 1rem; background: #fff; cursor: pointer; position: relative; }
    .pkg-card:hover { border-color: var(--gold); }
    .pkg-card.selected { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,168,76,0.18); }
    .pkg-name { font-family: var(--font-head); font-weight: 600; color: var(--navy); font-size: 1.05rem; }
    .pkg-price { color: var(--gold-dark); font-weight: 700; font-size: 1.2rem; margin: 0.4rem 0; }
    .pkg-features { font-size: 0.84rem; color: var(--muted); }
    .summary { background: #fafafa; border-radius: 5px; padding: 1rem 1.25rem; border-left: 4px solid var(--gold); margin: 1rem 0; }
    .summary .total { font-size: 1.2rem; color: var(--navy); font-weight: 700; padding-top: 0.5rem; margin-top: 0.5rem; border-top: 1px solid var(--border); }
    .status-pill { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.78rem; font-weight: 600; text-transform: uppercase; }
    .status-pill.generated { background: #d8f0dc; color: var(--success); }
    .status-pill.generating, .status-pill.awaiting_details, .status-pill.pending_payment, .status-pill.pending { background: #fff5d2; color: var(--gold-dark); }
    .status-pill.failed { background: #fbe0e0; color: var(--danger); }
    .download-card { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.25rem; background: #fff; border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 0.75rem; }
    .download-card a { background: var(--gold); color: var(--navy); padding: 0.55rem 1.25rem; border-radius: 5px; text-decoration: none; font-weight: 600; }
    .muted { color: var(--muted); font-size: 0.85rem; }
    .err { color: var(--danger); font-size: 0.9rem; }
  </style>
</head>
<body>
  <header class="app-header">
    {% if school_logo_url %}<img class="logo" src="{{ school_logo_url }}" alt="{{ school.name }}">{% endif %}
    <div>
      <div class="title">{{ school.name }} — SIWES Report</div>
      <div class="subtitle">{{ school.full_name }}</div>
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
